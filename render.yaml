# Render Blueprint — cho phép tạo service bằng 1 cú click ("New > Blueprint" trên Render,
# trỏ vào repo này) thay vì điền form thủ công. Các biến đánh dấu `sync: false` phải điền tay
# trên dashboard sau khi tạo (giá trị bí mật, không nên commit vào git).
# Xem hướng dẫn đầy đủ ở docs/DEPLOYMENT.md.

services:
  - type: web
    name: air-pollution-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: MQTT_URL
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES
        value: 15m
      - key: JWT_REFRESH_EXPIRES_DAYS
        value: "7"
      - key: CORS_ORIGIN
        sync: false

  # Render free tier không có Background Worker miễn phí — deploy device-simulator như 1 Web
  # Service (nhờ health server thuần http trong simulate.js) để có dữ liệu telemetry chảy liên
  # tục mà không phụ thuộc máy local. Cần UptimeRobot ping (giống service backend ở trên) để
  # tránh ngủ sau ~15 phút không request — xem NEXT_STEPS.md.
  - type: web
    name: air-pollution-device-simulator
    runtime: node
    rootDir: device-simulator
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MQTT_HOST
        sync: false
      - key: DEVICE_ID
        sync: false
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: DEVICE_HMAC_SECRET
        sync: false
      - key: PUBLISH_INTERVAL_MS
        value: "5000"
      - key: SCENARIO
        value: normal
